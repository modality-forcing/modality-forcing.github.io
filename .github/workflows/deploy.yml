name: Deploy placeholder page

# Publishes the static placeholder (index.html at the repo root) to GitHub
# Pages. No build step — the page is plain HTML.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent overlapping deploys; let the latest commit win.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (build_type=workflow) on first run if it isn't already.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the repo root; index.html is served at the site root.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
